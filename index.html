<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>SWASTIK - Basundhara Books</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Oriya:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
  <svg class="logo" viewBox="0 0 100 100" role="img" aria-label="Swastik">
    <path d="M50 15V85M15 50H85M50 15H80M85 50V80M50 85H20M15 50V20"/>
  </svg>
  <div>
    <h1>SWASTIK</h1>
    <p class="brand">Basundhara Books</p>
    <p class="tagline">ଓଡ଼ିଶାର ମାଗଣା ଶିକ୍ଷା ସାଥୀ</p>
  </div>
</header>

<main class="container">
  <section>
    <h2>ଶ୍ରେଣୀ ବାଛନ୍ତୁ (Select Class)</h2>
    <div class="class-grid" id="classGrid"></div>
  </section>

  <section id="contentDisplay">
    <h2 id="selectedClassTitle" class="gold">Basundhara Books</h2>
    <div id="subjectList">
      <p class="hint">ଉପରୁ କିମ୍ବା ତଳୁ ଗୋଟିଏ ଶ୍ରେଣୀ (Class 1 - 12) ବାଛନ୍ତୁ।</p>
    </div>
  </section>
</main>

<nav class="bottom-nav" id="bottomNav" aria-label="Classes"></nav>

<script src="script.js"></script>
</body>
</html>
