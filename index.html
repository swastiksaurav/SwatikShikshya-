<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWASTIK - Basundhara Books</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <div class="logo-container">
            <div class="swastik-logo">卐</div>
            <div class="title-container">
                <h1>SWASTIK</h1>
                <p class="brand-subtitle">Basundhara Books</p>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="container">
        <!-- Class Selector Buttons -->
        <section class="class-selection">
            <h2>Select Class (ଶ୍ରେଣୀ ଚୟନ କରନ୍ତୁ)</h2>
            <div class="class-grid" id="classGrid">
                <!-- Dynamic Buttons Generated via JS -->
            </div>
        </section>

        <!-- Dynamic Content Section -->
        <section class="content-display" id="contentDisplay">
            <h2 id="selectedClassTitle" class="gold-text">Basundhara Books - Class Content</h2>
            <div id="subjectList" class="subject-container">
                <p class="placeholder-text">ଦୟାକରି ଉପରୁ କୌଣସି ଗୋଟିଏ ଶ୍ରେଣୀ (Class 1 - 12) ବାଛନ୍ତୁ।</p>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation Bar for Classes -->
    <nav class="bottom-nav" id="bottomNav">
        <!-- Quick Access Bottom Buttons -->
    </nav>

    <script src="script.js"></script>
</body>
</html>
